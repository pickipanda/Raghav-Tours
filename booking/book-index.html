<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayodhya Travel Booking</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="book-styles.css">
</head>
<body>
  <div class="background-overlay"></div>

  <header>
    <div class="logo">YourTravel</div>
    <nav>
      <a href="#">Home</a>
      <a href="#packages">Packages</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Explore the Spiritual Heritage of Ayodhya!</h1>
  </section>

  <section class="form-section">
    <h2>Book Your Travel Package</h2>
    <form>
      <label for="nights">Nights</label>
      <select id="nights" name="nights">
        <option value="1">1 night</option>
        <option value="2">2 nights</option>
        <option value="3">3 nights</option>
        <option value="4">4 nights</option>
        <option value="5">5 nights</option>
      </select>

      <label for="places">Places</label>
      <select id="places" name="places" multiple>
        <option value="ram">Ram Janmabhoomi</option>
        <option value="hanuman">Hanuman Garhi</option>
        <option value="kanak">Kanak Bhawan</option>
        <option value="saryu">Saryu River</option>
        <option value="special">Pilgrimage Special</option>
        <option value="family">Family Package</option>
      </select>

      <label for="plan">Plan</label>
      <select id="plan" name="plan">
        <option value="budget">Budget Plan</option>
        <option value="standard">Standard Plan</option>
        <option value="premium">Premium Plan</option>
      </select>

      <label for="addons">Add-ons</label>
      <select id="addons" name="addons">
        <option value="none">None</option>
        <option value="guide">Local Guide</option>
        <option value="darshan">Temple Darshan Pass</option>
        <option value="boat">Boat Ride</option>
      </select>

      <label for="name">Name</label>
      <input type="email" placeholder="Email address" id="name" name="name">

      <label for="phone">Phone Number</label>
      <input type="tel" placeholder="Phone Number" id="phone" name="phone">

      <label for="people">Number of People</label>
      <input type="number" placeholder="Number of People" id="people" name="people">

      <label for="date">Travel Date</label>
      <input type="date" id="date" name="date">

      <p><strong>Estimated Cost</strong><br><span class="cost">$150</span></p>

      <button type="submit">Book Now</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2024 YourTravel. All rights reserved. &nbsp; Email: contact@yourtravel.com</p>
    <div class="social-icons">
      <a href="#"><img src="https://img.icons8.com/ios-filled/20/ffffff/facebook.png" alt="Facebook"></a>
      <a href="#"><img src="https://img.icons8.com/ios-filled/20/ffffff/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="https://img.icons8.com/ios-filled/20/ffffff/instagram-new.png" alt="Instagram"></a>
    </div>
  </footer>
</body>
</html>
